name: Nightly Job Scrapers

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  scrape:
    name: Run job scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: scrapers

    env:
      PROJECT_ID_URL: ${{ secrets.PROJECT_ID_URL }}
      PUBLISHABLE_KEY: ${{ secrets.PUBLISHABLE_KEY }}
      SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
      SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
      SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
      SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          echo "[scraper-ci] Installing scrapers/requirements.txt"
          pip install -r requirements.txt
          python -c "import playwright, supabase, dotenv; print('[scraper-ci] imports ok', 'supabase', getattr(supabase, '__version__', '?'))"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          echo "[scraper-ci] playwright install chromium --with-deps"
          playwright install chromium --with-deps
          python -c "from playwright.sync_api import sync_playwright; print('[scraper-ci] playwright ready')"

      - name: Verify Supabase environment
        env:
          PROJECT_ID_URL: ${{ secrets.PROJECT_ID_URL }}
          PUBLISHABLE_KEY: ${{ secrets.PUBLISHABLE_KEY }}
          SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
        run: |
          set -euo pipefail

          PROJECT_ID_URL="$(echo "${PROJECT_ID_URL:-}" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//')"
          PUBLISHABLE_KEY="$(echo "${PUBLISHABLE_KEY:-}" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//')"
          SECRET_KEYS="$(echo "${SECRET_KEYS:-}" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//')"

          if [ -z "$PROJECT_ID_URL" ]; then
            echo "::error::PROJECT_ID_URL secret is required (builds https://{PROJECT_ID_URL}.supabase.co)"
            exit 1
          fi
          if [ -z "$SECRET_KEYS" ]; then
            echo "::error::SECRET_KEYS secret is required for database writes"
            exit 1
          fi
          if [ -z "$PUBLISHABLE_KEY" ]; then
            echo "::warning::PUBLISHABLE_KEY secret is empty (optional for server-side scraper writes)"
          fi

          # Accept bare ref or accidental full host/URL in PROJECT_ID_URL
          case "$PROJECT_ID_URL" in
            https://*|http://*)
              PROJECT_ID_URL="$(echo "$PROJECT_ID_URL" | sed -E 's#https?://([^/]+).*#\1#')"
              ;;
          esac
          PROJECT_ID_URL="${PROJECT_ID_URL%.supabase.co}"

          URL="https://${PROJECT_ID_URL}.supabase.co"
          HOST="${PROJECT_ID_URL}.supabase.co"

          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::error::Supabase host ${HOST} does not resolve (DNS). Check PROJECT_ID_URL=${PROJECT_ID_URL}"
            exit 1
          fi

          echo "[scraper-ci] PROJECT_ID_URL: ${PROJECT_ID_URL}"
          echo "[scraper-ci] SUPABASE_URL: ${URL}"
          echo "[scraper-ci] PUBLISHABLE_KEY set: $([ -n "$PUBLISHABLE_KEY" ] && echo yes || echo no)"
          echo "[scraper-ci] SECRET_KEYS set: yes"
          echo "[scraper-ci] Supabase host resolves OK"

          {
            echo "PROJECT_ID_URL=${PROJECT_ID_URL}"
          } >> "$GITHUB_ENV"

      - name: Run scrapers
        # Explicitly re-pass secrets so scrape_jobs.py always sees them
        # (in addition to the job-level env block above).
        env:
          PROJECT_ID_URL: ${{ secrets.PROJECT_ID_URL }}
          PUBLISHABLE_KEY: ${{ secrets.PUBLISHABLE_KEY }}
          SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
          SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
          SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
          SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          echo "[scraper-ci] Starting scrape_jobs.py from $(pwd)"

          # Shell-level diagnostics (lengths only — never print secret values)
          echo "[scraper-ci] ENV DIAG: PROJECT_ID_URL set=$([ -n "${PROJECT_ID_URL+x}" ] && echo True || echo False) non_empty=$([ -n "${PROJECT_ID_URL:-}" ] && echo True || echo False) len=${#PROJECT_ID_URL}"
          echo "[scraper-ci] ENV DIAG: PUBLISHABLE_KEY set=$([ -n "${PUBLISHABLE_KEY+x}" ] && echo True || echo False) non_empty=$([ -n "${PUBLISHABLE_KEY:-}" ] && echo True || echo False) len=${#PUBLISHABLE_KEY}"
          echo "[scraper-ci] ENV DIAG: SECRET_KEYS set=$([ -n "${SECRET_KEYS+x}" ] && echo True || echo False) non_empty=$([ -n "${SECRET_KEYS:-}" ] && echo True || echo False) len=${#SECRET_KEYS}"

          if [ -z "${PROJECT_ID_URL:-}" ]; then
            echo "::error::PROJECT_ID_URL is empty — check that secrets.PROJECT_ID_URL exists in the repo"
            exit 1
          fi
          if [ -z "${SECRET_KEYS:-}" ]; then
            echo "::error::SECRET_KEYS is empty — check that secrets.SECRET_KEYS exists in the repo"
            exit 1
          fi

          # Normalize PROJECT_ID_URL the same way as the verify step
          case "$PROJECT_ID_URL" in
            https://*|http://*)
              export PROJECT_ID_URL="$(echo "$PROJECT_ID_URL" | sed -E 's#https?://([^/]+).*#\1#')"
              ;;
          esac
          export PROJECT_ID_URL="${PROJECT_ID_URL%.supabase.co}"

          echo "[scraper-ci] PROJECT_ID_URL len after normalize=${#PROJECT_ID_URL}"
          echo "[scraper-ci] URL=https://${PROJECT_ID_URL}.supabase.co"
          echo "[scraper-ci] Volume floors TARGET=${SCRAPER_TARGET_MIN} SUPPORT=${SCRAPER_SUPPORT_MIN} SALES=${SCRAPER_SALES_MIN}"
          # Export explicitly so the Python process inherits them
          export PROJECT_ID_URL PUBLISHABLE_KEY SECRET_KEYS
          python scrape_jobs.py
          code=$?
          echo "[scraper-ci] scrape_jobs.py finished with exit code ${code}"
          exit "${code}"
