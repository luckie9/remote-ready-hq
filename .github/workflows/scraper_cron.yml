name: Nightly Job Scrapers

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  scrape:
    name: Run job scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: scrapers

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
      SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
      SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          echo "[scraper-ci] Installing scrapers/requirements.txt"
          pip install -r requirements.txt
          python -c "import playwright, supabase, dotenv; print('[scraper-ci] imports ok', 'supabase', getattr(supabase, '__version__', '?'))"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          echo "[scraper-ci] playwright install chromium --with-deps"
          playwright install chromium --with-deps
          python -c "from playwright.sync_api import sync_playwright; print('[scraper-ci] playwright ready')"

      - name: Verify Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export SUPABASE_SECRET_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
          fi

          URL="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          URL="$(echo "$URL" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//')"
          KEY="${SUPABASE_SECRET_KEY:-}"

          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL) secret is required — no hardcoded fallback"
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY (or SUPABASE_SERVICE_ROLE_KEY) secret is required"
            exit 1
          fi

          if ! echo "$URL" | grep -Eqi '^https?://'; then
            URL="https://${URL#/}"
            echo "[scraper-ci] SUPABASE_URL missing protocol — forced https://"
          fi
          if echo "$URL" | grep -Eqi '^http://'; then
            URL="https://${URL#http://}"
            echo "[scraper-ci] SUPABASE_URL upgraded http → https"
          fi
          URL="${URL%/}"

          HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
          case "$HOST" in
            ujhsltihinwuysikzvhs.supabase.co)
              URL="https://ujhsltlhlnwuysikzvhs.supabase.co"
              echo "::warning::Typo host ${HOST} — rewriting to ${URL} (update the SUPABASE_URL secret)"
              HOST="ujhsltlhlnwuysikzvhs.supabase.co"
              ;;
            ujhsltlhinwuysikzvhs.supabase.co)
              URL="https://ujhsltlhlnwuysikzvhs.supabase.co"
              echo "::warning::Typo host ${HOST} — rewriting to ${URL} (update the SUPABASE_URL secret)"
              HOST="ujhsltlhlnwuysikzvhs.supabase.co"
              ;;
          esac

          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::error::Supabase host ${HOST} does not resolve (DNS). Fix SUPABASE_URL — no silent fallback."
            exit 1
          fi

          echo "[scraper-ci] SUPABASE_SECRET_KEY set: yes"
          echo "[scraper-ci] Effective SUPABASE_URL: ${URL}"
          echo "[scraper-ci] Supabase host resolves OK: ${HOST}"

          {
            echo "SUPABASE_URL=${URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
          } >> "$GITHUB_ENV"

      - name: Run scrapers
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
          SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
          SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          echo "[scraper-ci] Starting scrape_jobs.py from $(pwd)"

          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export SUPABASE_SECRET_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
          fi

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL missing after verify step"
            exit 1
          fi
          if [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::error::SUPABASE_SECRET_KEY (or SUPABASE_SERVICE_ROLE_KEY) is required"
            exit 1
          fi

          echo "[scraper-ci] Connecting to Supabase at: ${SUPABASE_URL}"
          echo "[scraper-ci] Volume floors TARGET=${SCRAPER_TARGET_MIN} SUPPORT=${SCRAPER_SUPPORT_MIN} SALES=${SCRAPER_SALES_MIN}"
          python scrape_jobs.py
          code=$?
          echo "[scraper-ci] scrape_jobs.py finished with exit code ${code}"
          exit "${code}"
