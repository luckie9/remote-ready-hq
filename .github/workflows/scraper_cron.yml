name: Nightly Job Scrapers

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  scrape:
    name: Run job scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: scrapers

    # Run #17 working pattern + current secret aliases
    env:
      # Current GitHub Secrets
      PROJECT_ID_URL: ${{ secrets.PROJECT_ID_URL }}
      PUBLISHABLE_KEY: ${{ secrets.PUBLISHABLE_KEY }}
      SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
      # Run #17 env names (still supported if present)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
      SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
      SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          echo "[scraper-ci] Installing scrapers/requirements.txt"
          pip install -r requirements.txt
          # Do not reinstall unpinned `supabase` — that upgrades past requirements.txt
          # and can break create_client(url, key) initialization.
          python -c "import playwright, supabase, dotenv; print('[scraper-ci] imports ok', 'supabase', getattr(supabase, '__version__', '?'))"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          echo "[scraper-ci] playwright install chromium --with-deps"
          playwright install chromium --with-deps
          python -c "from playwright.sync_api import sync_playwright; print('[scraper-ci] playwright ready')"

      - name: Verify Supabase environment
        env:
          PROJECT_ID_URL: ${{ secrets.PROJECT_ID_URL }}
          PUBLISHABLE_KEY: ${{ secrets.PUBLISHABLE_KEY }}
          SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          # Live project host (DNS-resolvable). Typo refs are rewritten below.
          DEFAULT_URL="https://ujhsltlhlnwuysikzvhs.supabase.co"

          # Map current secrets → run #17 env names
          if [ -z "${SUPABASE_URL:-}" ] && [ -n "${PROJECT_ID_URL:-}" ]; then
            PID="$(echo "$PROJECT_ID_URL" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//' -e 's#/*$##')"
            case "$PID" in
              https://*|http://*) SUPABASE_URL="$PID" ;;
              *.supabase.co) SUPABASE_URL="https://${PID}" ;;
              *) SUPABASE_URL="https://${PID}.supabase.co" ;;
            esac
            export SUPABASE_URL
            echo "[scraper-ci] Mapped PROJECT_ID_URL → SUPABASE_URL"
          fi
          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -n "${SECRET_KEYS:-}" ]; then
            export SUPABASE_SECRET_KEY="${SECRET_KEYS}"
            echo "[scraper-ci] Mapped SECRET_KEYS → SUPABASE_SECRET_KEY"
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ] && [ -n "${PUBLISHABLE_KEY:-}" ]; then
            export SUPABASE_ANON_KEY="${PUBLISHABLE_KEY}"
            echo "[scraper-ci] Mapped PUBLISHABLE_KEY → SUPABASE_ANON_KEY"
          fi

          URL="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          URL="$(echo "$URL" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//')"
          # Prefer SUPABASE_SECRET_KEY for server writes; map legacy service_role if needed.
          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export SUPABASE_SECRET_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
          fi
          KEY="${SUPABASE_SECRET_KEY:-}"
          ANON="${SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"

          if [ -z "$URL" ]; then
            URL="$DEFAULT_URL"
            echo "[scraper-ci] SUPABASE_URL empty — using default fallback"
          elif ! echo "$URL" | grep -Eqi '^https?://'; then
            URL="https://${URL#/}"
            echo "[scraper-ci] SUPABASE_URL missing protocol — forced https://"
          fi
          if echo "$URL" | grep -Eqi '^http://'; then
            URL="https://${URL#http://}"
            echo "[scraper-ci] SUPABASE_URL upgraded http → https"
          fi
          URL="${URL%/}"

          HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
          case "$HOST" in
            ujhsltihinwuysikzvhs.supabase.co|ujhsltlhinwuysikzvhs.supabase.co)
              echo "[scraper-ci] Known typo host ${HOST} — rewriting to default"
              URL="$DEFAULT_URL"
              HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
              ;;
          esac

          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::warning::Supabase host ${HOST} does not resolve (DNS) — using default fallback"
            URL="$DEFAULT_URL"
            HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
          fi

          echo "[scraper-ci] SUPABASE_SECRET_KEY set: $([ -n "${KEY}" ] && echo yes || echo no)"
          echo "[scraper-ci] SUPABASE_ANON_KEY set: $([ -n "${ANON}" ] && echo yes || echo no)"
          echo "[scraper-ci] Effective SUPABASE_URL: ${URL}"
          echo "[scraper-ci] Supabase host: ${HOST}"
          if getent hosts "$HOST" >/dev/null 2>&1; then
            echo "[scraper-ci] Supabase host resolves OK"
          else
            echo "::error::Default Supabase host also failed DNS — check runner network"
          fi

          {
            echo "SUPABASE_URL=${URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
          } >> "$GITHUB_ENV"

          if [ -z "$KEY" ]; then
            echo "::warning::Missing SUPABASE_SECRET_KEY / SECRET_KEYS — scrape cannot write to DB."
          fi

      - name: Run scrapers
        env:
          # Current secrets
          PROJECT_ID_URL: ${{ secrets.PROJECT_ID_URL }}
          PUBLISHABLE_KEY: ${{ secrets.PUBLISHABLE_KEY }}
          SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
          # Run #17 names (GITHUB_ENV URL preferred; do not re-inject bad SUPABASE_URL secret)
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
          SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
          SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
          PYTHONUNBUFFERED: "1"
        run: |
          DEFAULT_URL="https://ujhsltlhlnwuysikzvhs.supabase.co"
          echo "[scraper-ci] Starting scrape_jobs.py from $(pwd)"

          # Map current secrets → run #17 env names for scrape_jobs.py
          if [ -z "${SUPABASE_URL:-}" ] && [ -n "${PROJECT_ID_URL:-}" ]; then
            PID="$(echo "$PROJECT_ID_URL" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//' -e 's#/*$##')"
            case "$PID" in
              https://*|http://*) export SUPABASE_URL="$PID" ;;
              *.supabase.co) export SUPABASE_URL="https://${PID}" ;;
              *) export SUPABASE_URL="https://${PID}.supabase.co" ;;
            esac
          fi
          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -n "${SECRET_KEYS:-}" ]; then
            export SUPABASE_SECRET_KEY="${SECRET_KEYS}"
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SECRET_KEY}"
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ] && [ -n "${PUBLISHABLE_KEY:-}" ]; then
            export SUPABASE_ANON_KEY="${PUBLISHABLE_KEY}"
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ] && [ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            export SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          fi

          echo "[scraper-ci] SUPABASE_URL present: $([ -n "${SUPABASE_URL:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] SUPABASE_SECRET_KEY present: $([ -n "${SUPABASE_SECRET_KEY:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] SECRET_KEYS present: $([ -n "${SECRET_KEYS:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] PROJECT_ID_URL present: $([ -n "${PROJECT_ID_URL:-}" ] && echo yes || echo no)"

          URL="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-$DEFAULT_URL}}"
          URL="$(echo "$URL" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//' -e 's#/*$##')"
          if [ -z "$URL" ]; then
            URL="$DEFAULT_URL"
          elif ! echo "$URL" | grep -Eqi '^https?://'; then
            URL="https://${URL#/}"
          elif echo "$URL" | grep -Eqi '^http://'; then
            URL="https://${URL#http://}"
          fi
          HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
          case "$HOST" in
            ujhsltihinwuysikzvhs.supabase.co|ujhsltlhinwuysikzvhs.supabase.co)
              URL="$DEFAULT_URL"
              ;;
          esac
          if ! getent hosts "$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')" >/dev/null 2>&1; then
            URL="$DEFAULT_URL"
          fi
          export SUPABASE_URL="$URL"
          export NEXT_PUBLIC_SUPABASE_URL="$URL"
          echo "[scraper-ci] Connecting to Supabase at: ${SUPABASE_URL}"
          echo "[scraper-ci] Writes use supabase-py + SUPABASE_SECRET_KEY/SECRET_KEYS (run #17 pattern)"
          python scrape_jobs.py
          echo "[scraper-ci] scrape_jobs.py finished with exit code $?"
