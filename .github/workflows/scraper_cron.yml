name: Nightly Job Scrapers

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  scrape:
    name: Run job scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: scrapers

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN }}
      SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN }}
      SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          echo "[scraper-ci] Installing from scrapers/requirements.txt"
          pip install -r requirements.txt
          python -c "import playwright, supabase, dotenv; print('[scraper-ci] imports ok')"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          echo "[scraper-ci] Installing Playwright Chromium + system deps"
          playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; print('[scraper-ci] playwright ready')"

      - name: Verify Supabase environment
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          KEY="${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Missing Supabase secrets. Set SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL) and SUPABASE_SECRET_KEY (or SUPABASE_SERVICE_ROLE_KEY) in repo Actions secrets."
            echo "[scraper-ci] SUPABASE_URL set: $([ -n "${SUPABASE_URL:-}" ] && echo yes || echo no)"
            echo "[scraper-ci] NEXT_PUBLIC_SUPABASE_URL set: $([ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && echo yes || echo no)"
            echo "[scraper-ci] SUPABASE_SECRET_KEY set: $([ -n "${SUPABASE_SECRET_KEY:-}" ] && echo yes || echo no)"
            echo "[scraper-ci] SUPABASE_SERVICE_ROLE_KEY set: $([ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && echo yes || echo no)"
            exit 1
          fi
          {
            echo "SUPABASE_URL=${URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
            echo "SUPABASE_SECRET_KEY=${KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${KEY}"
          } >> "$GITHUB_ENV"
          echo "[scraper-ci] Supabase credentials present (host will be logged by scrape_jobs.py)."

      - name: Run scrapers
        run: |
          set -euo pipefail
          echo "[scraper-ci] Starting scrape_jobs.py from $(pwd)"
          python scrape_jobs.py
