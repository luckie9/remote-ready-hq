name: Nightly Job Scrapers

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  scrape:
    name: Run job scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: scrapers

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
      SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
      SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          echo "[scraper-ci] Installing scrapers/requirements.txt"
          pip install -r requirements.txt
          pip install playwright beautifulsoup4 supabase python-dotenv requests lxml
          python -c "import playwright, supabase, dotenv, bs4, requests; print('[scraper-ci] imports ok')"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          echo "[scraper-ci] playwright install chromium --with-deps"
          playwright install chromium --with-deps
          python -c "from playwright.sync_api import sync_playwright; print('[scraper-ci] playwright ready')"

      - name: Verify Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          # Live project host (DNS-resolvable). Typo refs are rewritten below.
          DEFAULT_URL="https://ujhsltlhlnwuysikzvhs.supabase.co"
          URL="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          URL="$(echo "$URL" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//')"
          KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}"

          if [ -z "$URL" ]; then
            URL="$DEFAULT_URL"
            echo "[scraper-ci] SUPABASE_URL empty — using default fallback"
          elif ! echo "$URL" | grep -Eqi '^https?://'; then
            URL="https://${URL#/}"
            echo "[scraper-ci] SUPABASE_URL missing protocol — forced https://"
          fi
          if echo "$URL" | grep -Eqi '^http://'; then
            URL="https://${URL#http://}"
            echo "[scraper-ci] SUPABASE_URL upgraded http → https"
          fi
          URL="${URL%/}"

          HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
          case "$HOST" in
            ujhsltihinwuysikzvhs.supabase.co|ujhsltlhinwuysikzvhs.supabase.co)
              echo "[scraper-ci] Known typo host ${HOST} — rewriting to default"
              URL="$DEFAULT_URL"
              HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
              ;;
          esac

          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::warning::Supabase host ${HOST} does not resolve (DNS) — using default fallback"
            URL="$DEFAULT_URL"
            HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
          fi

          echo "[scraper-ci] SUPABASE_SERVICE_ROLE_KEY set: $([ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] SUPABASE_SECRET_KEY set: $([ -n "${SUPABASE_SECRET_KEY:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] Effective SUPABASE_URL: ${URL}"
          echo "[scraper-ci] Supabase host: ${HOST}"
          if getent hosts "$HOST" >/dev/null 2>&1; then
            echo "[scraper-ci] Supabase host resolves OK"
          else
            echo "::error::Default Supabase host also failed DNS — check runner network"
          fi

          {
            echo "SUPABASE_URL=${URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
          } >> "$GITHUB_ENV"

          if [ -z "$KEY" ]; then
            echo "::warning::Missing SUPABASE_SERVICE_ROLE_KEY / SUPABASE_SECRET_KEY — scrape cannot write to DB."
          fi

      - name: Run scrapers
        env:
          # Prefer GITHUB_ENV URL from verify step; secrets still provide keys.
          # Do NOT re-inject secrets.SUPABASE_URL here — it may contain a typo host.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
          SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
          SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
          PYTHONUNBUFFERED: "1"
        run: |
          DEFAULT_URL="https://ujhsltlhlnwuysikzvhs.supabase.co"
          echo "[scraper-ci] Starting scrape_jobs.py from $(pwd)"
          echo "[scraper-ci] SUPABASE_URL present: $([ -n "${SUPABASE_URL:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] SUPABASE_SERVICE_ROLE_KEY present: $([ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] SUPABASE_SECRET_KEY present: $([ -n "${SUPABASE_SECRET_KEY:-}" ] && echo yes || echo no)"

          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export SUPABASE_SECRET_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SECRET_KEY}"
          fi

          URL="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-$DEFAULT_URL}}"
          URL="$(echo "$URL" | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//' -e 's#/*$##')"
          if [ -z "$URL" ]; then
            URL="$DEFAULT_URL"
          elif ! echo "$URL" | grep -Eqi '^https?://'; then
            URL="https://${URL#/}"
          elif echo "$URL" | grep -Eqi '^http://'; then
            URL="https://${URL#http://}"
          fi
          HOST="$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')"
          case "$HOST" in
            ujhsltihinwuysikzvhs.supabase.co|ujhsltlhinwuysikzvhs.supabase.co)
              URL="$DEFAULT_URL"
              ;;
          esac
          if ! getent hosts "$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')" >/dev/null 2>&1; then
            URL="$DEFAULT_URL"
          fi
          export SUPABASE_URL="$URL"
          export NEXT_PUBLIC_SUPABASE_URL="$URL"
          echo "[scraper-ci] Connecting to Supabase at: ${SUPABASE_URL}"
          python scrape_jobs.py
          echo "[scraper-ci] scrape_jobs.py finished with exit code $?"
