name: Nightly Job Scrapers

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  scrape:
    name: Run job scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: scrapers

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Use defaults when repo vars are unset — empty strings break int() in Python
      SCRAPER_TARGET_MIN: ${{ vars.SCRAPER_TARGET_MIN || '120' }}
      SCRAPER_SUPPORT_MIN: ${{ vars.SCRAPER_SUPPORT_MIN || '30' }}
      SCRAPER_SALES_MIN: ${{ vars.SCRAPER_SALES_MIN || '30' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          echo "[scraper-ci] Installing scrapers/requirements.txt"
          pip install -r requirements.txt
          # Explicit fallback packages (idempotent if already installed)
          pip install playwright beautifulsoup4 supabase python-dotenv requests lxml
          python -c "import playwright, supabase, dotenv, bs4, requests; print('[scraper-ci] imports ok')"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          echo "[scraper-ci] playwright install chromium --with-deps"
          playwright install chromium --with-deps
          python -c "from playwright.sync_api import sync_playwright; print('[scraper-ci] playwright ready')"

      - name: Verify Supabase environment
        run: |
          set +e
          URL="${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          KEY="${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          echo "[scraper-ci] SUPABASE_URL set: $([ -n "${SUPABASE_URL:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] NEXT_PUBLIC_SUPABASE_URL set: $([ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] SUPABASE_SECRET_KEY set: $([ -n "${SUPABASE_SECRET_KEY:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] SUPABASE_SERVICE_ROLE_KEY set: $([ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && echo yes || echo no)"
          echo "[scraper-ci] SCRAPER_TARGET_MIN=${SCRAPER_TARGET_MIN}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Missing Supabase secrets — scrape will run but cannot write to DB."
          else
            {
              echo "SUPABASE_URL=${URL}"
              echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
              echo "SUPABASE_SECRET_KEY=${KEY}"
              echo "SUPABASE_SERVICE_ROLE_KEY=${KEY}"
            } >> "$GITHUB_ENV"
            HOST="$(python -c 'import os,urllib.parse as u; print(u.urlparse(os.environ.get("URL","")).netloc)' 2>/dev/null || true)"
            # shell host parse fallback
            HOST="${HOST:-$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')}"
            echo "[scraper-ci] Supabase host: ${HOST}"
            if ! getent hosts "$HOST" >/dev/null 2>&1; then
              echo "::warning::Supabase host does not resolve (DNS). Check for typos in SUPABASE_URL (expected *.supabase.co project ref)."
            fi
            echo "[scraper-ci] Supabase credentials normalized for scrape_jobs.py"
          fi

      - name: Run scrapers
        run: |
          echo "[scraper-ci] Starting scrape_jobs.py from $(pwd)"
          # Script is hardened to always exit 0 on partial failures
          python scrape_jobs.py
          echo "[scraper-ci] scrape_jobs.py finished with exit code $?"
